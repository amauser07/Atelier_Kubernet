# Exercice 4 — Le Deployment de votre site.
# Aide : kubectl explain deployment.spec.template.spec.containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  labels:
    app: site
spec:
  replicas: 3                      # Exercice 5 : vous changerez cette valeur
  selector:
    matchLabels:
      app: site                    # doit correspondre aux labels du template ci-dessous
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.28        # utilisez nginx:1.27 (version précise, pas "latest")
          ports:
            - containerPort: 80    # le port sur lequel nginx écoute
          readinessProbe:          # Bonus B : trafic envoyé seulement aux pods prêts
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:               # Bonus B : ressources réservées / maximum
            requests:
              cpu: 50m
              memory: 32Mi
            limits: